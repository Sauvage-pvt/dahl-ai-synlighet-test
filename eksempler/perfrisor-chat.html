<title>Per Frisør chatbooking</title>
<style>
/* Plan: nøytral varm bakgrunn, dyp grønn som aksent, ro i bobler og knapper. */
:root{
  --bg:#f4f1ea; --surface:#ffffff; --fg:#1d1b18; --muted:#6f6a61; --line:#e2dccf;
  --accent:#2f5d50; --accent-fg:#ffffff; --me:#2f5d50; --me-fg:#ffffff; --log:#ebe6da; --chip:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --surface:#1d2024; --fg:#ece8df; --muted:#9b958a; --line:#30343a;
    --accent:#7fc2ac; --accent-fg:#0f1d18; --me:#7fc2ac; --me-fg:#0f1d18; --log:#22262b; --chip:#1d2024;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1d2024; --fg:#ece8df; --muted:#9b958a; --line:#30343a;
  --accent:#7fc2ac; --accent-fg:#0f1d18; --me:#7fc2ac; --me-fg:#0f1d18; --log:#22262b; --chip:#1d2024;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{min-width:0}
.brand h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
.tools{display:flex;align-items:center;gap:10px;flex-shrink:0}
.tools label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
button{font:inherit}
.ghost{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:34px}
.demo{margin:0;padding:8px 16px;font-size:12px;color:var(--muted);background:var(--log);border-bottom:1px solid var(--line)}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.row{display:flex;flex-direction:column;gap:8px;max-width:86%}
.row.me{align-self:flex-end;align-items:flex-end}
.row.bot{align-self:flex-start;align-items:flex-start}
.bubble{padding:10px 13px;border-radius:14px;white-space:pre-line;overflow-wrap:anywhere}
.bot .bubble{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.me .bubble{background:var(--me);color:var(--me-fg);border-top-right-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:8px 13px;min-height:40px;cursor:pointer;font-size:14px}
.chip:focus-visible,.ghost:focus-visible,.send:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip[disabled]{opacity:.35;cursor:default}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted);background:var(--log);padding:6px 9px;border-radius:8px;word-break:break-all;max-width:100%;align-self:stretch}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
input[type=text],input[type=email]{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-height:44px}
.send{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:0 16px;min-height:44px;cursor:pointer}
</style>

<div class="app">
  <header>
    <div class="brand">
      <h1>Per Frisør</h1>
      <p>Bookingassistent · demo</p>
    </div>
    <div class="tools">
      <label><input type="checkbox" id="showLog"> Vis API-kall</label>
      <button class="ghost" id="restart" type="button">Start på nytt</button>
    </div>
  </header>
  <p class="demo">Eksempel med testdata. Bookinger lagres bare i denne fanen og sendes ikke til noen.</p>
  <main id="chat" aria-live="polite"></main>
  <form id="input" autocomplete="off">
    <input type="text" id="text" placeholder="Skriv her, eller bruk knappene" aria-label="Skriv en melding">
    <button class="send" type="submit">Send</button>
  </form>
</div>

<script>
(function () {
  var SLUG = 'perfrisor';
  var SERVICES = {
    klipp: { label: 'Klipp', min: 45 },
    skjegg: { label: 'Klipp og skjegg', min: 60 }
  };
  var OPEN_DAYS = [2, 3, 4, 5, 6];            // tirsdag til lørdag. Mandag er stengt.
  var DAY_START = 9 * 60, DAY_END = 17 * 60;   // 09:00 til 17:00
  var LUNCH = [12 * 60, 13 * 60];              // lunsj 12:00 til 13:00

  var chat = document.getElementById('chat');
  var form = document.getElementById('input');
  var textEl = document.getElementById('text');
  var logToggle = document.getElementById('showLog');

  var state, bookings = [];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  function addRow(who, text) {
    var row = el('div', 'row ' + who);
    row.appendChild(el('div', 'bubble', text));
    chat.appendChild(row);
    scrollDown();
    return row;
  }
  function botSay(text, chips) {
    var row = addRow('bot', text);
    if (chips && chips.length) {
      var box = el('div', 'chips');
      chips.forEach(function (c) {
        var b = el('button', 'chip', c.label);
        b.type = 'button';
        b.addEventListener('click', function () {
          var all = chat.querySelectorAll('.chip');
          for (var i = 0; i < all.length; i++) all[i].disabled = true;
          addRow('me', c.label);
          c.pick();
        });
        box.appendChild(b);
      });
      row.appendChild(box);
    }
    scrollDown();
  }
  function logLine(text) {
    if (!logToggle.checked) return;
    var row = el('div', 'row bot');
    row.appendChild(el('div', 'log', text));
    chat.appendChild(row);
    scrollDown();
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hhmm(min) { return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }
  function dayKeyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseKey(key) { var p = key.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function dayShort(key) {
    return parseKey(key).toLocaleDateString('nb-NO', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function dayLong(key) {
    return parseKey(key).toLocaleDateString('nb-NO', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  // Neste åpne dager fra i morgen. Brukes både for knapper og for ordet «torsdag».
  function openDays(count) {
    var out = [], d = new Date();
    d.setHours(12, 0, 0, 0);
    for (var i = 1; out.length < count && i < 30; i++) {
      var c = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i);
      if (OPEN_DAYS.indexOf(c.getDay()) !== -1) out.push(dayKeyOf(c));
    }
    return out;
  }

  // Testdata: noen tider er «opptatt» på et fast mønster, så demoen er stabil.
  function demoBusy(key, min) {
    var h = 0, s = key + ':' + min;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h % 4 === 0;
  }
  function overlapsBooking(key, start, end) {
    return bookings.some(function (b) {
      return b.status === 'confirmed' && b.dayKey === key && start < b.end && end > b.start;
    });
  }
  function slotsFor(key, svc) {
    var dur = SERVICES[svc].min, free = [], busy = 0;
    for (var t = DAY_START; t + dur <= DAY_END; t += dur) {
      var end = t + dur;
      if (t < LUNCH[1] && end > LUNCH[0]) continue;     // hopper over lunsj
      var taken = demoBusy(key, t) || overlapsBooking(key, t, end);
      if (taken) busy++; else free.push(t);
    }
    return { free: free, busy: busy };
  }

  // ---------- flyt ----------
  function start() {
    state = { step: 'menu' };
    chat.innerHTML = '';
    botSay('Hei! Jeg er bookingassistenten til Per Frisør. Vil du booke en time, eller avbestille en du har fra før?', [
      { label: 'Book time', pick: askService },
      { label: 'Avbestill time', pick: askCancelRef }
    ]);
  }

  function askService() {
    state = { step: 'service' };
    var chips = Object.keys(SERVICES).map(function (k) {
      return { label: SERVICES[k].label + ' (' + SERVICES[k].min + ' min)', pick: function () { state.svc = k; askDay(); } };
    });
    botSay('Hva skal du ha gjort?', chips);
  }

  function askDay() {
    state.step = 'day';
    var days = openDays(8);
    var chips = days.map(function (k) {
      return { label: dayShort(k), pick: function () { state.dayKey = k; showSlots(); } };
    });
    botSay('Velg en dag. Vi har åpent tirsdag til lørdag.', chips);
  }

  function showSlots() {
    state.step = 'slot';
    var res = slotsFor(state.dayKey, state.svc);
    logLine('→ GET /api/v1/customers/' + SLUG + '/slots?service=' + state.svc +
      '&from=' + state.dayKey + 'T00:00&to=' + state.dayKey + 'T23:59');
    logLine('← 200 · ' + res.free.length + ' ledige, ' + res.busy + ' opptatt');

    var back = { label: 'Velg en annen dag', pick: askDay };
    if (!res.free.length) {
      botSay('Det er dessverre fullt den dagen. Velg en annen dag.', [back]);
      return;
    }
    var chips = res.free.slice(0, 12).map(function (m) {
      return { label: hhmm(m), pick: function () { state.minutes = m; askName(); } };
    });
    chips.push(back);
    botSay('Ledige tider ' + dayLong(state.dayKey) + ' for ' + SERVICES[state.svc].label.toLowerCase() + ':', chips);
  }

  function askName() {
    state.step = 'name';
    botSay('Hva heter du?');
  }
  function askEmail() {
    state.step = 'email';
    botSay('Hva er e-postadressen din? Bekreftelsen og avbestillingskoden sendes dit.');
  }
  function confirmBooking() {
    state.step = 'confirm';
    var svc = SERVICES[state.svc];
    botSay('Da booker jeg ' + svc.label.toLowerCase() + ' ' + dayLong(state.dayKey) + ' kl. ' +
      hhmm(state.minutes) + ', på navnet ' + state.name + '. Stemmer det?', [
      { label: 'Ja, book', pick: doBook },
      { label: 'Avbryt', pick: function () { botSay('Ok, jeg har ikke booket noe.', [{ label: 'Start på nytt', pick: start }]); } }
    ]);
  }

  function doBook() {
    var svc = SERVICES[state.svc];
    var start = state.minutes, end = start + svc.min;
    if (overlapsBooking(state.dayKey, start, end) || demoBusy(state.dayKey, start)) {
      logLine('← 409 · slot_unavailable');
      botSay('Beklager, den tiden ble tatt akkurat nå. Velg en ny tid.', [{ label: 'Velg en annen tid', pick: showSlots }]);
      return;
    }
    var ref = 'PF-' + Math.floor(1000 + Math.random() * 9000);
    var code = Math.random().toString(36).slice(2, 8).toUpperCase();
    var b = { ref: ref, code: code, dayKey: state.dayKey, start: start, end: end,
      svc: svc.label, name: state.name, email: state.email, status: 'confirmed' };
    bookings.push(b);
    logLine('→ POST /api/v1/customers/' + SLUG + '/bookings · Idempotency-Key: ' + ref);
    logLine('← 201 · status confirmed');
    botSay('Booket! ' + svc.label + ' ' + dayLong(state.dayKey) + ' kl. ' + hhmm(start) + '.\n\n' +
      'Referanse: ' + ref + '\nAvbestillingskode: ' + code + '\n\n' +
      'I en ekte løsning ville bekreftelsen gått til ' + state.email + '. Her sendes ingen e-post.', [
      { label: 'Start på nytt', pick: start }
    ]);
    state.step = 'done';
  }

  function askCancelRef() {
    state.step = 'cancelRef';
    botSay('Skriv referansen fra bekreftelsen, for eksempel PF-1234.');
  }

  function handleCancelRef(text) {
    var ref = text.trim().toUpperCase();
    var b = bookings.filter(function (x) { return x.ref === ref && x.status === 'confirmed'; })[0];
    if (!b) { botSay('Fant ingen aktiv booking med den referansen. Prøv igjen, eller skriv «avbryt».'); return; }
    state.cancelBooking = b;
    state.step = 'cancelCode';
    botSay('Skriv avbestillingskoden du fikk i bekreftelsen.');
  }

  function handleCancelCode(text) {
    var b = state.cancelBooking;
    if (text.trim().toUpperCase() !== b.code) {
      botSay('Feil kode. Prøv igjen, eller skriv «avbryt».');
      return;
    }
    b.status = 'cancelled';
    logLine('→ DELETE /api/v1/bookings/' + b.ref + ' · X-Cancel-Token: ••••');
    logLine('← 204 · tiden er frigjort');
    state.step = 'done';
    botSay('Avbestilt. ' + b.svc + ' ' + dayLong(b.dayKey) + ' kl. ' + hhmm(b.start) + ' er ledig igjen.', [
      { label: 'Book en ny time', pick: askService }
    ]);
  }

  // ---------- tekstfelt ----------
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = textEl.value.trim();
    if (!text) return;
    textEl.value = '';
    addRow('me', text);
    var low = text.toLowerCase();

    if (low === 'avbryt' || low === 'start på nytt' || low === 'start på nytt') { start(); return; }

    if (state.step === 'name') {
      state.name = text;
      askEmail();
      return;
    }
    if (state.step === 'email') {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(text)) {
        botSay('Den adressen ser ikke helt riktig ut. Prøv igjen, for eksempel navn@epost.no.');
        return;
      }
      state.email = text;
      confirmBooking();
      return;
    }
    if (state.step === 'cancelRef') { handleCancelRef(text); return; }
    if (state.step === 'cancelCode') { handleCancelCode(text); return; }

    if (low.indexOf('avbestill') !== -1) { askCancelRef(); return; }
    if (low.indexOf('book') !== -1 || low.indexOf('ledig') !== -1 || low.indexOf('time') !== -1) { askService(); return; }
    botSay('Jeg kan hjelpe deg å booke eller avbestille. Velg et alternativ, eller skriv «book» eller «avbestill».', [
      { label: 'Book time', pick: askService },
      { label: 'Avbestill time', pick: askCancelRef }
    ]);
  });

  document.getElementById('restart').addEventListener('click', start);
  start();
})();
</script>
